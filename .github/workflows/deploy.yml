name: Build and Deploy

on:
  push:
    branches: ["master"]
  # Rebuild after the daily data sync commits. Commits pushed with GITHUB_TOKEN do not
  # trigger `push` workflows (GitHub's recursion safeguard), so listen for the run instead.
  workflow_run:
    workflows: ["Update papers and metrics"]
    types: [completed]
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master  # workflow_run would otherwise check out the commit before the sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Build site and search index
        run: npm run build
      - name: Check legacy URLs, links and scripts
        run: |
          python scripts/check_urls.py
          python scripts/check_site.py dist
          python -m unittest discover -s tests
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
