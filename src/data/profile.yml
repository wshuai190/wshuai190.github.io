teaching:
  course: INFS7410
  title: { en: Information Retrieval and Web Search, zh: 信息检索与网络搜索 }
  body:
    en: >-
      I coordinate and lecture INFS7410 at UQ, teaching 120+ Master's students across classical
      IR, dense retrieval, LLMs for search, RAG and evaluation. I mentor students on retrieval,
      RAG and biomedical NLP projects; several have progressed to PhD scholarships and SIGIR/ECIR papers.
    zh: >-
      我担任昆士兰大学 INFS7410 课程协调员与主讲教师，面向 120+ 名硕士生讲授传统信息检索、稠密检索、
      用于搜索的大语言模型、RAG 与评测。我也指导学生开展检索、RAG 与生物医学 NLP 研究，已有学生获得博士奖学金并发表 SIGIR/ECIR 论文。
  link: https://my.uq.edu.au/programs-courses/course.html?course_code=INFS7410

