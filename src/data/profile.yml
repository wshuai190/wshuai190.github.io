  en: >-
    Research Fellow at <a href="https://ielab.io/">ielab</a>, The University of Queensland.
    I coordinate and teach INFS7410 Information Retrieval and Web Search. PhD (2025) with
    <a href="https://ielab.io/people/guido-zuccon">Guido Zuccon</a>,
    <a href="https://bevankoopman.github.io/">Bevan Koopman</a> and
    <a href="https://scells.me/">Harrisen Scells</a>.
  zh: >-
    我在昆士兰大学 <a href="https://ielab.io/">ielab</a> 担任研究员，并担任 INFS7410（信息检索与网络搜索）课程协调员与主讲教师。
    2025 年在 Guido Zuccon、Bevan Koopman 与 Harrisen Scells 指导下完成博士学位。

summary:
  en: >-
    <strong>Dr. Shuai Wang</strong> is a Research Fellow at <a href="https://ielab.io/">ielab</a>,
    The University of Queensland. He works on <strong>information retrieval</strong>,
    <strong>search agents</strong>, <strong>retrievers and rerankers</strong>,
    <strong>biomedical evidence search</strong> and <strong>efficient RAG systems</strong>, with papers at SIGIR, WSDM, WWW, ECIR, EMNLP and EACL.
    He completed his PhD at UQ in 2025 under the supervision of
    <a href="https://researchers.uq.edu.au/researcher/22857">Prof. Guido Zuccon</a>,
    <a href="https://bevankoopman.github.io/">A/Prof. Bevan Koopman</a> and
    <a href="https://scells.me/">Dr. Harrisen Scells</a>, and is Course Coordinator and Lecturer
    for INFS7410.
  zh: >-
    <strong>王率博士</strong>现任昆士兰大学 <a href="https://ielab.io/">ielab</a> 研究员，研究方向为<strong>信息检索</strong>、
    <strong>search agents</strong>、<strong>检索与重排序模型</strong>、<strong>生物医学证据检索</strong>与<strong>高效 RAG 系统</strong>，
    成果发表于 SIGIR、WSDM、WWW、ECIR、EMNLP、EACL 等会议。他于 2025 年在
    <a href="https://researchers.uq.edu.au/researcher/22857">Prof. Guido Zuccon</a>、
    <a href="https://bevankoopman.github.io/">A/Prof. Bevan Koopman</a> 与
    <a href="https://scells.me/">Dr. Harrisen Scells</a> 指导下获得昆士兰大学博士学位，现任 INFS7410 课程协调员与主讲教师。

cv_profile:
  en: >-
    I build search and LLM systems that are effective, efficient, and inspectable for expert
    workflows, with a focus on deep-research agents, systematic review search, and
    evidence-grounded generation.
  zh: 专注于构建高效、可检视、可落地的检索与生成系统，尤其面向深度研究流程、系统综述检索与高风险信息场景。

themes:
  - topic: agents
    en: { title: Search agents and deep-research workflows, body: "Task decomposition, Boolean retrieval, structured inspect cards, section-level fetching and tool-using agents." }
    zh: { title: Search agents 与深度研究流程, body: "任务分解、Boolean 检索、结构化 inspect 卡片、章节级 fetch 与工具调用 Agent。" }
  - topic: retrieval
    en: { title: Retrievers and rerankers, body: "2D Matryoshka retrieval, diffusion retrievers, reasoning rerankers, federated search and reproducibility studies." }
    zh: { title: 检索与重排序模型, body: "2D Matryoshka 检索、扩散检索模型、推理型重排序、联邦检索与可复现研究。" }
  - topic: evidence
    en: { title: Biomedical evidence search, body: "MeSH suggestion, screening prioritisation, Boolean query generation and seed-driven retrieval for systematic reviews." }
    zh: { title: 生物医学证据检索, body: "面向系统综述的 MeSH 推荐、筛选优先级排序、Boolean 查询生成与种子文献驱动检索。" }
  - topic: rag
    en: { title: Efficient RAG and LLM systems, body: "Context embeddings, retrieval–generation interfaces, memory optimisation and more efficient inference pipelines." }
    zh: { title: 高效 RAG 与 LLM 系统, body: "上下文嵌入、检索与生成接口、记忆优化，以及更高效的推理流程。" }
  - topic: memory
    en: { title: Memory for LLM agents, body: "How long-term memory for conversational agents should be built, retrieved and evaluated." }
    zh: { title: LLM Agent 记忆, body: "研究对话 Agent 的长期记忆应如何构建、检索与评测。" }
  - topic: security
    en: { title: Robustness and security, body: "How prompt-injection attacks travel through rankers and realistic RAG pipelines." }
    zh: { title: 鲁棒性与安全, body: "研究提示注入攻击如何穿过排序器与真实 RAG 流程。" }
