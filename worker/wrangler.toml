# "Talk with my digital twin" backend: a Cloudflare Worker (free plan) that answers questions about
# Shuai Wang from the site's own llms-full.txt, using the Gemini API free tier.
#
# Deploy:  cd worker && npx wrangler login && npx wrangler secret put GEMINI_API_KEY && npx wrangler deploy
name = "shuaiwang-twin"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
SITE = "https://shuaiwang.io"
# Any Gemini model id from https://ai.google.dev/gemini-api/docs/models ("-latest" follows new releases).
GEMINI_MODEL = "gemini-flash-latest"
ALLOWED_ORIGINS = "https://shuaiwang.io,https://www.shuaiwang.io,http://localhost:4321,http://localhost:4322"

# Per-visitor limit (Workers rate limiting binding, free plan): 8 messages per minute per IP.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }
